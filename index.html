<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Listening Pro" />
    <title>Listening Pro</title>
    <meta
      name="description"
      content="Listening Pro - listening practice with mobile-friendly speech and an elegant liquid-glass UI."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/favicon/icon-iphone.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-blur"></div>

    <header class="topbar glass-panel">
      <div class="brand-wrap">
        <div class="brand-mark">L</div>
        <div>
          <div class="brand-title">Listening Pro</div>
        </div>
      </div>

      <div class="top-controls">
        <div class="speed-group glass-soft">
          <span class="label">Speed</span>
          <input id="globalSpeed" type="range" min="0.7" max="1.8" step="0.1" value="1.0" aria-label="再生速度" />
          <span id="globalSpeedVal" class="speed-value">1.0x</span>
        </div>

        <div class="user-pill glass-soft hidden" id="accountStatusPill">
          <span id="planDisplay" class="plan-display">Free</span>
          <span class="divider">|</span>
          <span class="tiny-label">残:</span>
          <span id="creditDisplay" class="credit-display">0</span>
        </div>

        <button id="settingsBtn" class="icon-btn glass-soft hidden" aria-label="設定">⚙️</button>
        <button id="logoutBtn" class="secondary-btn hidden" aria-label="ログアウト">ログアウト</button>
      </div>
    </header>

    <main class="app-shell">
      <section id="viewStart" class="panel fade-in">
        <div class="glass-panel intro-card">
          <div class="intro-row">
            <div class="intro-copy">
              <p class="eyebrow">Listening Practice</p>
              <h1>英語の音声を聞いて、自然な返答を選ぶ</h1>
            </div>
          </div>

          <div class="panel-block">
            <label class="field-label" for="dataInput">音声テキスト</label>
            <textarea id="dataInput" rows="8" placeholder="例: Good morning. I would like a coffee and a sandwich, please."></textarea>
          </div>

          <div class="action-row">
            <button id="pasteBtn" class="secondary-btn" type="button">貼り付け</button>
            <button id="startTestBtn" class="primary-btn" type="button" disabled>開始</button>
          </div>
        </div>
      </section>

      <section id="viewExam" class="panel hidden fade-in">
        <div class="glass-panel exam-card">
          <div class="exam-header">
            <div>
              <p class="eyebrow">Listening Test</p>
              <h2 id="examTitleDisplay">Listening Test</h2>
            </div>
            <button id="masterPlayBtn" class="secondary-btn" type="button">再生</button>
          </div>

          <div class="status-strip">
            <div class="count-badge" id="questionCounter">1/1</div>
            <div class="progress-wrap">
              <div class="progress-bar">
                <span id="sequencerProgress"></span>
              </div>
            </div>
            <div class="status-text" id="sequencerState">READY</div>
          </div>

          <div class="message-line" id="sequencerMessage">▶️ 音声を再生して開始</div>

          <div class="question-box" id="questionArea"></div>

          <div class="exam-actions">
            <button id="prevQBtn" class="secondary-btn" type="button">◀ 前へ</button>
            <button id="toggleDoubtBtn" class="toggle-btn" type="button" aria-label="疑問なし">疑問</button>
            <button id="nextQBtn" class="primary-btn" type="button">次へ ▶</button>
          </div>

          <button id="submitTestBtn" class="submit-btn hidden" type="button">採点する</button>
        </div>
      </section>

      <section id="viewResult" class="panel hidden fade-in">
        <div class="glass-panel result-card">
          <div class="result-header">
            <div>
              <p class="eyebrow">Result</p>
              <h2>採点結果</h2>
            </div>
            <div class="score-box">
              <span id="scoreDisplay">0</span>
              <small>点</small>
            </div>
          </div>

          <ul id="resultList" class="result-list"></ul>

          <div class="action-row result-actions">
            <button id="returnTopBtn" class="secondary-btn" type="button">トップへ戻る</button>
          </div>
        </div>
      </section>
    </main>

    <div id="loginOverlay" class="login-overlay">
      <div class="login-card glass-panel">
        <div class="login-mark">L</div>
        <h1>Listening Pro</h1>
        <p>IDを入力してください</p>
        <input id="userIdInput" type="text" placeholder="User ID" autocomplete="username" />
        <button id="loginBtn" class="primary-btn" type="button">ログイン</button>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-backdrop" data-close="settings"></div>
      <div class="modal-panel glass-panel">
        <div class="modal-header">
          <h3>設定</h3>
          <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="閉じる">✕</button>
        </div>

        <div class="settings-list">
          <label class="toggle-row">
            <span>自動ログイン</span>
            <label class="switch">
              <input id="settingAutoLogin" type="checkbox" />
              <span class="slider-t"></span>
            </label>
          </label>

          <div class="setting-row">
            <span>再生速度</span>
            <div class="speed-inline">
              <input id="settingSpeed" type="range" min="0.7" max="1.8" step="0.1" value="1.0" />
              <span id="settingSpeedVal">1.0x</span>
            </div>
          </div>
        </div>

        <button id="saveSettingsBtn" class="primary-btn" type="button">保存</button>
      </div>
    </div>

    <div id="reviewModal" class="modal hidden">
      <div class="modal-backdrop" data-close="review"></div>
      <div class="modal-panel review-panel glass-panel">
        <div class="modal-header">
          <div class="review-title-wrap">
            <span id="reviewModalIcon" class="review-icon">◯</span>
            <h3 id="reviewModalTitle">復習</h3>
          </div>
          <button id="closeReviewBtn" class="icon-btn" type="button" aria-label="閉じる">✕</button>
        </div>

        <div id="reviewScriptArea" class="review-script-area"></div>

        <button id="reviewPlayAllBtn" class="primary-btn" type="button">全体を再生</button>
      </div>
    </div>

    <div id="toast" class="toast hidden">保存しました</div>

    <script src="app.js"></script>
  </body>
</html>
